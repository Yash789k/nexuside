name: Desktop installers
on:
  push:
    branches: [codex/nexuside-desktop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac --arm64
            label: mac-arm64
          - os: windows-latest
            target: --win --x64
            label: windows-x64
          - os: ubuntu-latest
            target: --linux --x64
            label: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Artifact paths
        id: paths
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `downloads=${path.resolve('../nexuside-desktop-downloads')}\nevidence=${path.resolve('../nexuside-desktop-evidence')}\n`);
          JS
      - run: npm run check
      - run: npm run test:cli
      - name: Configure Linux development sandbox
        if: runner.os == 'Linux'
        run: |
          node -e "require('electron')"
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Desktop integration
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Desktop integration on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
        env:
          DEBUG: pw:browser
      - name: Package installers
        run: npx electron-builder ${{ matrix.target }} --publish never
      - name: Verify packaged macOS app
        if: runner.os == 'macOS'
        run: npm run test:desktop
        env:
          NEXUS_DESKTOP_EXE: ../nexuside-desktop-downloads/mac-arm64/NexusIDE.app/Contents/MacOS/NexusIDE
          NEXUS_DESKTOP_EVIDENCE: ../nexuside-desktop-evidence/packaged
      - name: Install Windows desktop package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem ../nexuside-desktop-downloads/*.exe | Select-Object -First 1).FullName
          $installDir = Join-Path $env:RUNNER_TEMP 'nexuside-installed'
          $result = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer exited with $($result.ExitCode)" }
          $executable = Join-Path $installDir 'NexusIDE.exe'
          if (!(Test-Path $executable)) { throw "Installed executable is missing" }
          "NEXUS_DESKTOP_EXE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify installed Windows app
        if: runner.os == 'Windows'
        run: npm run test:desktop
        env:
          NEXUS_DESKTOP_EVIDENCE: ../nexuside-desktop-evidence/packaged
      - name: Install Linux desktop package
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ../nexuside-desktop-downloads/*.deb
      - name: Verify installed Linux app
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
        env:
          NEXUS_DESKTOP_EXE: /opt/NexusIDE/nexuside
          NEXUS_DESKTOP_EVIDENCE: ../nexuside-desktop-evidence/packaged
      - uses: actions/upload-artifact@v4
        with:
          name: nexuside-${{ matrix.label }}
          path: |
            ${{ steps.paths.outputs.downloads }}/*.dmg
            ${{ steps.paths.outputs.downloads }}/*.zip
            ${{ steps.paths.outputs.downloads }}/*.exe
            ${{ steps.paths.outputs.downloads }}/*.AppImage
            ${{ steps.paths.outputs.downloads }}/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-evidence-${{ matrix.label }}
          path: ${{ steps.paths.outputs.evidence }}
