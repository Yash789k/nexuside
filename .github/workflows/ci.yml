name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:cli
      - run: python3 scripts/cli-pty.py
        if: runner.os != 'Windows'
      - run: node dist/cli.cjs demo smoke --yes --host
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: node scripts/qa.mjs soak
        env:
          NEXUS_SOAK_SECONDS: 1800
          NEXUS_SOAK_LABEL: ci-soak
      - run: xvfb-run -a npm run test:extension
      - run: npm run sandbox-build
      - run: npm run test:sandbox
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-evidence
          path: |
            test-results-interactions
            ../nexuside-qa-evidence
