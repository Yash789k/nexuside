name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:cli
      - run: python3 scripts/cli-pty.py
        if: runner.os != 'Windows'
      - run: node dist/cli.cjs demo smoke --yes --host
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:soak
        env:
          NEXUS_SOAK_LABEL: release-soak
      - run: xvfb-run -a npm run test:extension
      - run: npm run sandbox-build
      - run: npm run test:sandbox
  publish:
    needs: [verify, integration]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package:vsix
      - run: npm run package:cli
      - name: Create checksums
        run: cd ../nexuside-local-qa && sha256sum nexuside-*.vsix nexuside-*.tgz > SHA256SUMS.txt
      - name: Publish download assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ../nexuside-local-qa/nexuside-*.vsix ../nexuside-local-qa/nexuside-*.tgz ../nexuside-local-qa/SHA256SUMS.txt
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            gh release create "$GITHUB_REF_NAME" ../nexuside-local-qa/nexuside-*.vsix ../nexuside-local-qa/nexuside-*.tgz ../nexuside-local-qa/SHA256SUMS.txt --verify-tag --title "NexusIDE $GITHUB_REF_NAME" --notes-file CHANGELOG.md
          fi
          nexus_release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .id)
          gh api -H 'Cache-Control: no-cache' "repos/$GITHUB_REPOSITORY/releases/$nexus_release_id/assets?per_page=100" > /tmp/nexus-release-assets.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const assets = JSON.parse(fs.readFileSync('/tmp/nexus-release-assets.json', 'utf8'));
          for (const name of [`nexuside-${version}.vsix`, `nexuside-${version}.tgz`, 'SHA256SUMS.txt']) {
            if (!assets.some(a => a.name === name && a.size > 0 && a.state === 'uploaded')) {
              throw new Error(`Published release is missing ${name}`);
            }
          }
          JS
