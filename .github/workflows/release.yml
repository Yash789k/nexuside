name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node dist/cli.cjs demo smoke --yes --host
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: xvfb-run -a npm run test:extension
      - run: npm run sandbox-build
      - run: npm run test:sandbox
  publish:
    needs: [verify, integration]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package:vsix
      - run: npm run package:cli
      - name: Create checksums
        run: cd .. && sha256sum nexuside-*.vsix nexuside-*.tgz > SHA256SUMS.txt
      - name: Publish download assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ../nexuside-*.vsix ../nexuside-*.tgz ../SHA256SUMS.txt --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            gh release create "$GITHUB_REF_NAME" ../nexuside-*.vsix ../nexuside-*.tgz ../SHA256SUMS.txt --verify-tag --title "NexusIDE $GITHUB_REF_NAME" --notes-file CHANGELOG.md
          fi
